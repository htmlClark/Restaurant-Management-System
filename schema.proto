syntax = "proto3";

package com.restaurant.generated;

option java_outer_classname = "RestaurantProto";

message Role {
  int32 role_id = 1;
  string role = 2;
}

message User {
  int32 user_id = 1;
  int32 role_id = 2;
  string name = 3;
  string password = 4;
}

message Login {
  int32 login_id = 1;
  int32 user_id = 2;
  string time_login = 3;
  string time_logout = 4;
}

message Dish {
  int32 dish_id = 1;
  string dish_name = 2;
  string dish_category = 3;
  double price = 4;
}

message Recipe {
  int32 recipe_id = 1;
  string inv_id = 2;
  int32 dish_id = 3;
  int32 quantity = 4;
}

message InventoryItem {
  string inv_id = 1;
  string ingredient_name = 2;
  double quantity = 3;
  string dish_category = 4;
  double measurement = 5;
}

message WasteLog {
  int32 waste_id = 1;
  string inv_id = 2;
  int32 user_id = 3;
  double quantity = 4;
  string reason = 5;
  string remarks = 6;
}

message Delivery {
  string delivery_id = 1;
  string inv_id = 2;
  string expiration_date = 3;
  string delivery_date = 4;
  string delivery_time = 5;
  string courier = 6;
}

message Order {
  int32 order_id = 1;
  int32 dish_id = 2;
  string order_date = 3;
  string order_time = 4;
  string status = 5;
}

message PaymentMethod {
  int32 payment_id = 1;
  string payment_method = 2;
}

message OrderItem {
  int32 order_item_id = 1;
  int32 order_id = 2;
  int32 dish_id = 3;
  int32 payment_id = 4;
  int32 quantity = 5;
  double price = 6;
}
